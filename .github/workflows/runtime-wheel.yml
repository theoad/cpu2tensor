# SPDX-License-Identifier: AGPL-3.0-only
name: x86 learner runtime

on:
  pull_request:
    paths:
      - .github/workflows/runtime-wheel.yml
      - ci/Dockerfile
      - ci/build-runtime-wheel.sh
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CPython 3.12 x86 wheelhouse
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build the pinned runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ci/Dockerfile
          load: true
          tags: cpu2tensor-runtime:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and verify the offline runtime
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet
          mkdir -p "$RUNNER_TEMP/cpu2tensor-runtime"
          builder_image_id="$(docker image inspect --format '{{.Id}}' cpu2tensor-runtime:local)"
          docker run --rm \
            --env CPU2TENSOR_SOURCE_SHA="$GITHUB_SHA" \
            --env CPU2TENSOR_BUILDER_IMAGE_ID="$builder_image_id" \
            --env CPU2TENSOR_OUTPUT_DIR=/output \
            --volume "$PWD:/workspace:ro" \
            --volume "$RUNNER_TEMP/cpu2tensor-runtime:/output" \
            cpu2tensor-runtime:local \
            ./ci/build-runtime-wheel.sh

      - name: Upload the verified runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpu2tensor-runtime-cp312-linux-x86_64
          path: ${{ runner.temp }}/cpu2tensor-runtime/*
          if-no-files-found: error
          retention-days: 30

# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and selected system tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build the pinned test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ci/Dockerfile
          load: true
          tags: cpu2tensor-ci:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run unit tests with coverage
        run: >-
          docker run --rm
          --volume "$PWD:/workspace"
          cpu2tensor-ci:local
          ./ci/run-unit-tests.sh

      - name: Decide whether system tests are required
        id: system
        env:
          TESTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./ci/should-run-system-tests.sh "$GITHUB_EVENT_NAME" "$TESTED_COMMIT" "$GITHUB_OUTPUT"

      - name: Run real local worker system tests
        if: steps.system.outputs.run == 'true'
        run: >-
          docker run --rm
          --volume "$PWD:/workspace"
          cpu2tensor-ci:local
          ./ci/run-system-tests.sh

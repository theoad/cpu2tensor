[build-system]
requires = ["scikit-build-core>=0.10,<1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "cpu2tensor"
version = "0.5.1"
description = "CPU execution traces as tensors"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
dependencies = ["numpy>=1.26", "torch>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]
gym = ["gymnasium>=1.0,<2"]
notebook = ["jupyterlab>=4,<5", "nbclient>=0.10,<1", "matplotlib>=3.7"]

[tool.scikit-build]
cmake.source-dir = "native"
wheel.packages = ["python/cpu2tensor"]
sdist.include = ["native/**", "python/**", "LICENSE", "docs/**", "example/**"]

[tool.scikit-build.cmake.define]
CPU2TENSOR_BUILD_PYTHON = "ON"
BUILD_TESTING = "OFF"

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.coverage.run]
source = ["cpu2tensor"]
omit = ["*/cpu2tensor/examples/*"]
relative_files = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
